name: Production check

# Checks Contro on the live site from outside the home network (a GitHub runner):
# a smoke test with the security headers required, then an OWASP ZAP baseline
# scan (Star Destroyer ADR-007). The portal's own production check covers only
# games listed as live, so Contro runs its own until it is listed.
# Run it after each release: gh workflow run "Production check" -R soncsec/contro
on:
  workflow_dispatch:
  schedule:
    - cron: '47 7 * * 1' # weekly, Monday 07:47 UTC

permissions:
  contents: read

env:
  URL: http://games.soncrant.com/contro/

jobs:
  smoke:
    name: Smoke test from outside
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test with security headers required
        run: python3 scripts/smoke_test.py "$URL" --title "Contro" --require-headers

  zap:
    name: ZAP baseline scan of production
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ZAP 2.17.0 baseline (passive scan only)
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 # 2.17.0
        run: |
          mkdir -p zap && chmod 777 zap
          set +e
          # -I: warnings alone don't fail the run; scripts/zap_check.py decides.
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$URL" -J report.json -r report.html -I
          rc=$?
          set -e
          # 0-2 = scan finished; 3 or more = ZAP itself failed.
          if [ "$rc" -ge 3 ]; then exit "$rc"; fi

      - name: Fail on high-risk findings
        run: python3 scripts/zap_check.py zap/report.json

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-production
          path: zap/
          retention-days: 30
